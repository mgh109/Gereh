name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, fileinfo
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: PHP syntax check
        run: find app -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify CodeIgniter CLI bootstrap
        run: |
          CI_ENVIRONMENT=development php spark routes 2>&1 || {
            echo 'CodeIgniter CLI bootstrap failed; collecting application logs.'
            find writable/logs -type f -name '*.log' -maxdepth 1 -exec tail -n 80 {} \; || true
            exit 1
          }

      - name: Assert critical public and cart routes are registered
        run: |
          CI_ENVIRONMENT=development php spark routes > /tmp/gereh-routes.txt
          grep -F 'api/v1/products' /tmp/gereh-routes.txt
          grep -F 'api/v1/cart/items' /tmp/gereh-routes.txt
          grep -F 'sitemap.xml' /tmp/gereh-routes.txt
          grep -F 'robots.txt' /tmp/gereh-routes.txt

  migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: gereh_ci
          MYSQL_USER: gereh_ci
          MYSQL_PASSWORD: password_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Configure isolated CI database
        run: |
          cat > .env <<'EOF'
          CI_ENVIRONMENT = development
          app.baseURL = 'http://localhost:8080/'
          database.default.hostname = 127.0.0.1
          database.default.database = gereh_ci
          database.default.username = gereh_ci
          database.default.password = password_ci_only
          database.default.DBDriver = MySQLi
          database.default.port = 3306
          EOF
      - name: Apply migrations against MySQL
        run: |
          php spark migrate --all
          php spark migrate:status

      - name: HTTP smoke tests (catalog and auth guards)
        run: |
          php spark serve --host 127.0.0.1 --port 8080 > /tmp/gereh-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/robots.txt >/dev/null; then break; fi
            sleep 1
          done
          check_status() {
            expected="$1"
            url="$2"
            got=$(curl -sS -o /tmp/gereh-http-response -w '%{http_code}' "$url")
            if [ "$got" != "$expected" ]; then
              echo "Expected $expected, got $got for $url"
              cat /tmp/gereh-http-response
              tail -n 100 /tmp/gereh-serve.log
              exit 1
            fi
          }
          check_status 200 http://127.0.0.1:8080/api/v1/products
          check_status 200 http://127.0.0.1:8080/api/v1/categories
          check_status 200 http://127.0.0.1:8080/api/v1/brands
          check_status 401 http://127.0.0.1:8080/api/v1/me
          check_status 401 http://127.0.0.1:8080/api/v1/orders
          check_status 401 http://127.0.0.1:8080/api/v1/admin/dashboard
          check_status 200 http://127.0.0.1:8080/api/v1/auth/csrf
          check_status 200 http://127.0.0.1:8080/sitemap.xml
          # Unsafe mutations without CSRF must be rejected before controller execution.
          denied=$(curl -sS -o /tmp/gereh-csrf-denied -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"variant_id":1,"quantity":1}' \
            http://127.0.0.1:8080/api/v1/cart/items)
          if [ "$denied" != "403" ]; then
            echo "Expected 403 for missing CSRF token, got $denied"
            cat /tmp/gereh-csrf-denied
            exit 1
          fi
