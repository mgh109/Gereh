openapi: 3.0.3
info:
  title: GEREH Store API
  version: 1.0.0
  description: Implemented endpoints. Checkout returns 503 until a verified payment integration is enabled. Sessions and CSRF are for same-origin web clients only.
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      summary: Retrieve same-origin CSRF token
      responses:
        '200': { description: CSRF token, header name and field name }
  /auth/otp/request:
    post:
      summary: Request OTP (requires configured SMS adapter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile: { type: string, pattern: '^09[0-9]{9}$' }
      responses:
        '200': { description: SMS accepted by configured provider }
        '422': { description: Invalid mobile }
        '429': { description: Throttled }
        '503': { description: SMS unavailable }
  /auth/otp/verify:
    post:
      summary: Consume code and begin customer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code]
              properties:
                mobile: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Authenticated customer session }
        '401': { description: Invalid or expired OTP }
  /auth/logout:
    post:
      summary: End customer session
      responses:
        '200': { description: Logged out }
  /me:
    get:
      summary: Read logged-in customer profile
      responses:
        '200': { description: Customer profile }
        '401': { description: Login required }
    patch:
      summary: Update name fields of logged-in customer
      responses:
        '200': { description: Updated customer profile }
        '401': { description: Login required }
        '422': { description: Invalid fields }
  /cart:
    get:
      summary: Current session cart with live prices
      responses:
        '200': { description: Cart summary }
  /cart/items:
    post:
      summary: Add variant to session cart
      responses:
        '200': { description: Updated cart }
        '409': { description: Stock unavailable }
        '422': { description: Invalid input }
  /cart/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Update variant quantity, zero removes it
      responses:
        '200': { description: Updated cart }
        '409': { description: Item missing or unavailable }
        '422': { description: Invalid quantity }
    delete:
      summary: Remove variant from cart
      responses:
        '200': { description: Updated cart }
  /checkout:
    post:
      summary: Checkout temporarily disabled until OTP and ZarinPal integration is verified
      responses:
        '503': { description: Checkout is not yet available }
  /orders:
    get:
      summary: List orders belonging to authenticated customer
      responses:
        '200': { description: Orders }
        '401': { description: Login required }
  /orders/{id}:
    get:
      summary: One order owned by authenticated customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Order detail }
        '401': { description: Login required }
        '404': { description: Order not found or not owned }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: gereh_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
